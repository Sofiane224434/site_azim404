# ═══════════════════════════════════════════════════════════════════════
# WORKFLOW DE DÉPLOIEMENT AUTOMATIQUE - REACT + VITE
# ═══════════════════════════════════════════════════════════════════════
name: Deploy React App to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape 2 : Se connecter au VPS et déployer
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            APP_DIR=~/apps/azim
            REPO_URL=https://github.com/${{ github.repository }}.git

            echo "📁 Préparation du dossier..."
            mkdir -p $APP_DIR
            cd $APP_DIR

            echo "📥 Récupération du code..."
            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/main
            else
              git clone $REPO_URL .
            fi

            echo "🐳 Build Docker..."
            docker compose down || true
            docker stop traefik azim_main_site || true
            docker rm traefik azim_main_site || true
            docker compose build --no-cache

            echo "🚀 Lancement des containers..."
            docker compose up -d

            echo "🧹 Nettoyage..."
            docker image prune -f

            echo "✅ Déploiement terminé !"
            docker ps
