# ═══════════════════════════════════════════════════════════════════════
# WORKFLOW DE DÉPLOIEMENT AUTOMATIQUE - REACT + VITE
# ═══════════════════════════════════════════════════════════════════════
name: Deploy site_azim404 to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            APP_DIR=~/apps/azim404
            REPO_URL=https://github.com/${{ github.repository }}.git

            echo "🌐 Vérification du réseau Docker..."
            docker network inspect web >/dev/null 2>&1 || docker network create web

            echo "📁 Préparation du dossier..."
            mkdir -p $APP_DIR
            cd $APP_DIR

            echo "📥 Récupération du code..."
            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/main
              # Conserver les fichiers persistants générés côté serveur (certificats, variables locales)
              git clean -fd -e letsencrypt/ -e .env
            else
              git init
              git remote add origin $REPO_URL
              git fetch origin main
              git checkout -B main origin/main
            fi

            echo "🐳 Déploiement Docker..."
            docker compose down || true
            docker compose up -d --build

            echo "🔎 Vérification du service local..."
            docker compose ps
            if ! docker ps --format '{{.Names}}' | grep -q '^azim_main_site$'; then
              echo "❌ Le conteneur azim_main_site n'est pas actif"
              docker compose logs --tail=120
              exit 1
            fi

            if command -v curl >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:3001/sitemap.xml >/dev/null
            else
              wget -qO- http://127.0.0.1:3001/sitemap.xml >/dev/null
            fi

            echo "🧹 Nettoyage..."
            docker image prune -f

            echo "✅ Déploiement terminé !"
            docker ps | grep azim404
