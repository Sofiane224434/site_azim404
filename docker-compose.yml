services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=admin@azim404.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      # Redirection HTTPS désactivée temporairement pour génération du certificat
      # - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      # - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - web

  azim-site:
    build: .
    container_name: azim_main_site
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Router HTTP (pour challenge Let's Encrypt et accès temporaire)
      - "traefik.http.routers.azim-http.rule=Host(`azim404.com`) || Host(`www.azim404.com`)"
      - "traefik.http.routers.azim-http.entrypoints=web"
      # Router HTTPS (avec certificat SSL)
      - "traefik.http.routers.azim-https.rule=Host(`azim404.com`) || Host(`www.azim404.com`)"
      - "traefik.http.routers.azim-https.entrypoints=websecure"
      - "traefik.http.routers.azim-https.tls.certresolver=myresolver"
      # Service
      - "traefik.http.services.azim.loadbalancer.server.port=80"
    networks:
      - web

networks:
  web:
    driver: bridge
